<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとう — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --border: #eee; --muted: #999; --text: #111; }
    body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #fafafa; color: var(--text); }

    header { background: white; border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .logo { font-weight: 900; font-size: 1rem; letter-spacing: 0.1em; }
    .badge { font-size: 0.7rem; background: #111; color: white; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.06em; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .stat-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .stat-num { font-size: 2rem; font-weight: 900; line-height: 1; }
    .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.06em; }

    /* Section */
    .section { background: white; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; overflow: hidden; }
    .section-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-weight: 800; font-size: 0.9rem; }
    .section-count { font-size: 0.75rem; color: var(--muted); }

    /* Users */
    .user-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 20px; }
    .user-card { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px; }
    .user-photo { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: #999; }
    .user-photo img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 0.68rem; font-weight: 700; text-align: center; line-height: 1.3; }
    .user-date { font-size: 0.6rem; color: var(--muted); }

    /* Records */
    .record-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .record-row:last-child { border-bottom: none; }
    .record-thumb { width: 56px; height: 42px; border-radius: 6px; overflow: hidden; background: #eee; flex-shrink: 0; }
    .record-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .record-info { flex: 1; min-width: 0; }
    .record-person { font-weight: 700; font-size: 0.85rem; }
    .record-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .record-thanks { font-size: 0.72rem; font-weight: 700; color: #555; margin-top: 4px; }
    .thanks-badge { display: inline-block; background: #f0f0f0; border-radius: 20px; padding: 2px 10px; }

    /* Thanks */
    .thanks-row { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
    .thanks-row:last-child { border-bottom: none; }
    .thanks-source { font-size: 0.68rem; padding: 2px 7px; border-radius: 8px; font-weight: 700; flex-shrink: 0; }
    .thanks-source.user { background: #111; color: white; }
    .thanks-source.auto { background: #eee; color: #666; }
    .thanks-sender { font-size: 0.82rem; font-weight: 700; flex-shrink: 0; min-width: 80px; }
    .thanks-target { font-size: 0.78rem; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thanks-time { font-size: 0.68rem; color: var(--muted); flex-shrink: 0; }

    /* Push */
    .push-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); }
    .push-row:last-child { border-bottom: none; }
    .push-name { font-weight: 700; font-size: 0.85rem; }
    .push-count { font-size: 0.72rem; color: var(--muted); }

    .loading { padding: 24px 20px; color: var(--muted); font-size: 0.85rem; }
    .empty { padding: 24px 20px; color: #ccc; font-size: 0.85rem; text-align: center; }

    .refresh-btn { font-size: 0.75rem; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
    .refresh-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>

<header>
  <div class="logo">ありがとう</div>
  <div class="badge">ADMIN</div>
  <button class="refresh-btn" style="margin-left:auto" onclick="loadAll()">更新</button>
</header>

<div class="container">

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">USERS</div></div>
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">RECORDS</div></div>
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">THANKS</div></div>
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">ZONES</div></div>
    <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">PUSH 購読</div></div>
  </div>

  <!-- Users -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">ユーザー</div>
      <div class="section-count" id="users-count"></div>
    </div>
    <div class="user-grid" id="users-body"><div class="loading">読み込み中…</div></div>
  </div>

  <!-- Records -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">整備記録</div>
      <div class="section-count" id="records-count"></div>
    </div>
    <div id="records-body"><div class="loading">読み込み中…</div></div>
  </div>

  <!-- Thanks -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">ありがとう履歴</div>
      <div class="section-count" id="thanks-count"></div>
    </div>
    <div id="thanks-body"><div class="loading">読み込み中…</div></div>
  </div>

  <!-- Push -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">プッシュ通知 購読状況</div>
      <div class="section-count" id="push-count"></div>
    </div>
    <div id="push-body"><div class="loading">読み込み中…</div></div>
  </div>

</div>

<script>
const API = "";

function fmt(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function loadAll() {
  await Promise.all([loadStats(), loadUsers(), loadRecords(), loadThanks(), loadPush()]);
}

async function loadStats() {
  const s = await fetch(`${API}/admin/stats`).then(r => r.json());
  const nums = [s.users, s.records, s.thanks, s.zones, s.subscriptions];
  const labels = ["USERS", "RECORDS", "THANKS", "ZONES", "PUSH 購読"];
  document.getElementById("stats").innerHTML = nums.map((n, i) => `
    <div class="stat-card">
      <div class="stat-num">${n}</div>
      <div class="stat-label">${labels[i]}</div>
    </div>
  `).join("");
}

async function loadUsers() {
  const users = await fetch(`${API}/users`).then(r => r.json());
  document.getElementById("users-count").textContent = `${users.length}人`;
  if (!users.length) { document.getElementById("users-body").innerHTML = '<div class="empty">なし</div>'; return; }
  document.getElementById("users-body").innerHTML = users.map(u => `
    <div class="user-card">
      <div class="user-photo">
        ${u.photo_url ? `<img src="${u.photo_url}" alt="">` : (u.last_name || "？")[0]}
      </div>
      <div class="user-name">${u.last_name}<br>${u.first_name}</div>
      <div class="user-date">${fmt(u.created_at)}</div>
    </div>
  `).join("");
}

async function loadRecords() {
  const records = await fetch(`${API}/admin/records`).then(r => r.json());
  document.getElementById("records-count").textContent = `${records.length}件`;
  if (!records.length) { document.getElementById("records-body").innerHTML = '<div class="empty">なし</div>'; return; }
  document.getElementById("records-body").innerHTML = records.map(r => {
    const thumb = r.after_photo || r.before_photo;
    return `
    <div class="record-row">
      <div class="record-thumb">
        ${thumb ? `<img src="${thumb}" alt="">` : ""}
      </div>
      <div class="record-info">
        <div class="record-person">${r.person_name || "—"}</div>
        <div class="record-meta">${r.zone_name || r.zone_id} · ${fmt(r.created_at)}</div>
        <div class="record-thanks"><span class="thanks-badge">ありがとう ${r.thanks_count}件</span></div>
      </div>
    </div>`;
  }).join("");
}

async function loadThanks() {
  const thanks = await fetch(`${API}/admin/thanks`).then(r => r.json());
  document.getElementById("thanks-count").textContent = `${thanks.length}件`;
  if (!thanks.length) { document.getElementById("thanks-body").innerHTML = '<div class="empty">なし</div>'; return; }

  // 整備記録のIDと名前のマップを作る
  const records = await fetch(`${API}/admin/records`).then(r => r.json());
  const recordMap = {};
  records.forEach(r => { recordMap[r.id] = `${r.person_name}（${r.zone_name || r.zone_id}）`; });

  document.getElementById("thanks-body").innerHTML = thanks.map(t => `
    <div class="thanks-row">
      <span class="thanks-source ${t.source}">${t.source === "user" ? "手動" : "自動"}</span>
      <span class="thanks-sender">${t.sender_name || "—"}</span>
      <span class="thanks-target">→ ${recordMap[t.maintenance_id] || t.maintenance_id}${t.message ? `　「${t.message}」` : ""}</span>
      <span class="thanks-time">${fmt(t.created_at)}</span>
    </div>
  `).join("");
}

async function loadPush() {
  const subs = await fetch(`${API}/admin/subscriptions`).then(r => r.json());
  document.getElementById("push-count").textContent = `${subs.length}人`;
  if (!subs.length) { document.getElementById("push-body").innerHTML = '<div class="empty">なし</div>'; return; }
  document.getElementById("push-body").innerHTML = subs.map(s => `
    <div class="push-row">
      <span class="push-name">${s.person_name || "（未登録）"}</span>
      <span class="push-count">端末 ${s.count}台</span>
    </div>
  `).join("");
}

loadAll();
</script>
</body>
</html>
