<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arigato</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8faf8; color: #222; }

    header {
      background: #4caf82; color: white;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; letter-spacing: 0.05em; }
    header span { font-size: 0.85rem; opacity: 0.85; }

    main { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* フィード */
    .card {
      background: white; border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .card-meta {
      padding: 12px 16px 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .person { font-weight: bold; color: #4caf82; }
    .zone-tag {
      background: #e8f5ee; color: #4caf82;
      padding: 2px 10px; border-radius: 20px; font-size: 0.8rem;
    }
    .time { font-size: 0.75rem; color: #999; padding: 0 16px 8px; }
    .card-photo { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; background: #eee; }
    .before-after { display: flex; }
    .before-after img { width: 50%; aspect-ratio: 4/3; object-fit: cover; }
    .before-after .label {
      position: absolute; background: rgba(0,0,0,0.4); color: white;
      font-size: 0.7rem; padding: 2px 6px; border-radius: 0 0 4px 0;
    }
    .photo-wrap { position: relative; flex: 1; }

    .thanks-area { padding: 8px 16px 16px; }
    .thanks-btn {
      width: 100%; padding: 10px;
      background: #f0faf5; border: 1px solid #4caf82;
      border-radius: 8px; color: #4caf82; font-size: 0.95rem;
      cursor: pointer;
    }
    .thanks-btn:active { background: #e0f5ea; }
    .thanks-count { font-size: 0.8rem; color: #999; text-align: center; margin-top: 6px; }

    /* 投稿ボタン（FAB） */
    .fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 64px; height: 64px; border-radius: 50%;
      background: #4caf82; color: white; border: none;
      font-size: 1.6rem; cursor: pointer;
      box-shadow: 0 4px 14px rgba(76,175,130,0.5);
    }

    /* 投稿モーダル */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: white; width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0; padding: 24px;
    }
    .modal h2 { font-size: 1rem; margin-bottom: 16px; color: #444; }
    .zone-name { color: #4caf82; font-weight: bold; }

    .photo-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .photo-box {
      flex: 1; border: 2px dashed #ccc; border-radius: 10px;
      aspect-ratio: 4/3; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; position: relative;
    }
    .photo-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-box span { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
    .photo-box .icon { font-size: 1.8rem; }

    .post-btn {
      width: 100%; padding: 14px; background: #4caf82;
      color: white; border: none; border-radius: 10px;
      font-size: 1rem; cursor: pointer; font-weight: bold;
    }
    .post-btn:disabled { background: #ccc; }
    .cancel-btn {
      width: 100%; padding: 10px; background: none; border: none;
      color: #999; font-size: 0.9rem; cursor: pointer; margin-top: 8px;
    }

    /* 名前登録 */
    .name-screen {
      position: fixed; inset: 0; background: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px;
    }
    .name-screen .logo { font-size: 3rem; margin-bottom: 12px; }
    .name-screen h2 { margin-bottom: 6px; }
    .name-screen p { color: #888; margin-bottom: 28px; font-size: 0.9rem; }
    .name-screen input {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 10px; font-size: 1rem; margin-bottom: 12px;
    }
    .name-screen button {
      width: 100%; padding: 14px; background: #4caf82;
      color: white; border: none; border-radius: 10px;
      font-size: 1rem; cursor: pointer; font-weight: bold;
    }

    .zone-header {
      background: white; padding: 12px 20px; margin-bottom: 4px;
      border-bottom: 1px solid #eee; font-size: 0.9rem; color: #666;
    }
    .zone-header strong { color: #4caf82; }

    .hidden { display: none; }
    .empty { text-align: center; color: #bbb; padding: 48px 0; }

    /* 認証画面 */
    .auth-screen {
      position: fixed; inset: 0; background: white; z-index: 400;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .auth-screen.hidden { display: none; }
    .auth-inner {
      width: 100%; max-width: 390px; padding: 40px 28px;
      display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center;
    }
    .auth-logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.1em; margin-bottom: 40px; }
    .auth-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .auth-sub { font-size: 0.8rem; color: #999; margin-bottom: 32px; text-align: center; }
    .auth-btn {
      width: 100%; padding: 16px; border-radius: 14px;
      border: 1.5px solid #eee; background: white;
      font-size: 0.95rem; font-weight: 700; font-family: inherit;
      cursor: pointer; margin-bottom: 12px; text-align: left;
    }
    .auth-btn.primary { background: #111; color: white; border-color: #111; }
    .auth-btn-sub { font-size: 0.75rem; font-weight: 400; margin-top: 3px; opacity: 0.6; }
    .auth-btn:disabled { background: #f5f5f5; color: #bbb; border-color: #eee; cursor: default; }
    .auth-back {
      width: 100%; background: none; border: none; font-size: 0.85rem;
      color: #999; cursor: pointer; margin-bottom: 28px; padding: 0;
      font-family: inherit; text-align: left;
    }
    .auth-name-row {
      display: flex; gap: 10px; width: 100%; margin-bottom: 14px;
    }
    .auth-input {
      flex: 1 1 0; min-width: 0; padding: 14px 16px;
      border: 1.5px solid #eee; border-radius: 12px;
      font-size: 0.95rem; font-family: inherit; outline: none; background: #f7f7f7;
    }
    .auth-input:focus { border-color: #111; background: white; }
    .auth-selfie-wrap { margin: 20px 0 28px; width: 100%; }
    .auth-selfie {
      width: 90px; height: 90px; border-radius: 50%;
      border: 1.5px solid #eee; background: #f7f7f7;
      margin: 0 auto; display: flex; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; transition: background 0.15s;
    }
    .auth-selfie:hover { background: #e8e8e8; }
    .auth-selfie img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .auth-selfie-label { text-align: center; font-size: 0.72rem; color: #999; margin-top: 8px; }
    .auth-selfie-icon { width: 28px; height: 28px; stroke: #ccc; }
    .auth-user-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      width: 100%; overflow-y: auto; max-height: 55vh; align-content: flex-start;
    }
    .auth-user-card {
      display: flex; flex-direction: column; align-items: center;
      width: 76px; cursor: pointer; padding: 8px; border-radius: 12px;
      border: 2px solid transparent; transition: all 0.15s;
    }
    .auth-user-card:hover { background: #f5f5f5; }
    .auth-user-card.selected { border-color: #111; background: #f5f5f5; }
    .auth-user-photo {
      width: 56px; height: 56px; border-radius: 50%;
      overflow: hidden; background: #eee; margin-bottom: 6px;
    }
    .auth-user-photo img { width: 100%; height: 100%; object-fit: cover; }
    .auth-user-name { font-size: 0.68rem; font-weight: 700; text-align: center; line-height: 1.4; color: #222; }

    /* モード選択シート */
    .mode-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 110;
    }
    .mode-sheet {
      background: white; width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0; padding: 20px 20px 36px;
    }
    .mode-handle {
      width: 36px; height: 4px; background: #e0e0e0;
      border-radius: 2px; margin: 0 auto 20px;
    }
    .mode-btn {
      width: 100%; padding: 16px 20px;
      border: 1.5px solid #eee; border-radius: 12px;
      background: white; cursor: pointer; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px; text-align: left;
    }
    .mode-btn:last-child { margin-bottom: 0; }
    .mode-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: #f5f5f5; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .mode-label { font-weight: bold; font-size: 0.95rem; }
    .mode-sub { font-size: 0.75rem; color: #999; margin-top: 2px; }
  </style>
</head>
<body>

<!-- 認証：最初の選択 -->
<div class="auth-screen hidden" id="authChoice">
  <div class="auth-inner">
    <div class="auth-logo">ありがとう</div>
    <div class="auth-title" id="authChoiceTitle">はじめてのありがとうですか？</div>
    <div class="auth-sub">はじめての方は登録してください</div>
    <button class="auth-btn primary" onclick="showRegister()">
      はじめて
      <div class="auth-btn-sub">名前と写真を登録する</div>
    </button>
    <button class="auth-btn" onclick="showSelect()">
      すでに登録してる
      <div class="auth-btn-sub">一覧から自分を選ぶ</div>
    </button>
  </div>
</div>

<!-- 認証：登録フォーム -->
<div class="auth-screen hidden" id="authRegister">
  <div class="auth-inner">
    <button class="auth-back" onclick="showChoice()">← 戻る</button>
    <div class="auth-title">名前を登録する</div>
    <div class="auth-sub">フルネームで入力してください</div>
    <div class="auth-name-row">
      <input class="auth-input" id="inputLastName" placeholder="姓" type="text">
      <input class="auth-input" id="inputFirstName" placeholder="名" type="text">
    </div>
    <div class="auth-selfie-wrap">
      <div class="auth-selfie" id="authSelfie" onclick="document.getElementById('authSelfieFile').click()">
        <img id="authSelfieImg" src="" alt="">
        <svg class="auth-selfie-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="authSelfieIcon">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <input type="file" id="authSelfieFile" accept="image/*" capture="user" style="display:none" onchange="previewAuthSelfie(this)">
      </div>
      <div class="auth-selfie-label">顔写真を撮る（任意）</div>
    </div>
    <button class="auth-btn primary" onclick="completeRegister()" style="margin-top:auto;text-align:center">登録</button>
  </div>
</div>

<!-- 認証：ユーザー選択 -->
<div class="auth-screen hidden" id="authSelect">
  <div class="auth-inner">
    <button class="auth-back" onclick="showChoice()">← 戻る</button>
    <div class="auth-title" style="margin-bottom:16px">あなたはどれですか？</div>
    <div class="auth-user-grid" id="authUserGrid"></div>
    <button class="auth-btn" id="confirmBtn" onclick="confirmSelect()" style="margin-top:20px;text-align:center" disabled>決定</button>
  </div>
</div>

<!-- ヘッダー -->
<header>
  <h1>🌱 arigato</h1>
  <span id="headerName"></span>
</header>

<!-- ゾーンヘッダー（QRアクセス時） -->
<div class="zone-header hidden" id="zoneHeader"></div>

<!-- フィード -->
<main id="feedList"></main>

<!-- 投稿ボタン -->
<button class="fab" onclick="openModeSelect()">📷</button>

<!-- モード選択シート -->
<div class="mode-overlay hidden" id="modeOverlay" onclick="closeModeSelect(event)">
  <div class="mode-sheet">
    <div class="mode-handle"></div>
    <button class="mode-btn" onclick="startBefore()">
      <div class="mode-icon">🌱</div>
      <div>
        <div class="mode-label">この場所を手伝う</div>
        <div class="mode-sub">手伝う前の様子を記録してから</div>
      </div>
    </button>
    <button class="mode-btn" onclick="startAfter()">
      <div class="mode-icon">✅</div>
      <div>
        <div class="mode-label">手伝いました</div>
        <div class="mode-sub">手伝った後の様子を記録する</div>
      </div>
    </button>
  </div>
</div>

<!-- 投稿モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">📍 を良くしました</h2>
    <div class="form-group" id="zoneSelectWrap" style="margin-bottom:14px;display:none">
      <select id="modalZoneSelect" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.95rem"></select>
    </div>
    <div class="photo-row">
      <div class="photo-box" id="beforeBox">
        <input type="file" accept="image/*" capture="environment" id="beforePhoto" onchange="previewPhoto(this,'beforeBox','beforeImg')">
        <div class="icon">📷</div>
        <span>Before（任意）</span>
        <img id="beforeImg" class="hidden">
      </div>
      <div class="photo-box" id="afterBox">
        <input type="file" accept="image/*" capture="environment" id="afterPhoto" onchange="previewPhoto(this,'afterBox','afterImg')">
        <div class="icon">✨</div>
        <span>After</span>
        <img id="afterImg" class="hidden">
      </div>
    </div>
    <button class="post-btn" id="postBtn" onclick="submitPost()">記録する</button>
    <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
