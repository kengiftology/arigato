name: Write down the daily numbers

# その日の数字を自分で取って記録に残す（2026-09-23）。
# 手で毎晩叩いていたが、叩き忘れるとその日の数字は二度と取れない。
# /spirit/log は新しい順にしか返さず、古い記録から消えていくため（9/19 は半日ぶん落とした）。
#
# **GitHub の予定実行はあてにならない。**見張り（watch.yml）で実測したところ、
# 10分おきの予定に対して実際は中央値3時間10分・最長7時間に1回しか走っていない
# （9/17〜9/23 の38回で、10分前後だったのは0回。GitHub 側の間引き）。
# そこで
#   ・1日4回に増やして、間引かれても数回は走るようにする
#   ・**前日ぶんも数え直す**。23時台の予定が日付をまたいで走ると、その日の締めが
#     永久に取れなくなるため（/spirit/log は古いものから消える）
# 書き替えは day_report.py が守る。前より小さい数にはしないので、
# 記録が届ききらなかった実行が、届いていた実行の数字を潰すことはない。
on:
  schedule:
    - cron: '0 21 * * *'    # 日本時間 06:00
    - cron: '0 3 * * *'     # 日本時間 12:00
    - cron: '0 9 * * *'     # 日本時間 18:00
    - cron: '0 14 * * *'    # 日本時間 23:00
  workflow_dispatch:
    inputs:
      day:
        description: '数える日（YYYY-MM-DD・空なら今日）'
        required: false
        default: ''

# 同時に走らせない。2つの実行が同じ行を書き替えると、あとの1つが押し負ける
concurrency:
  group: daily-numbers
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the chart library and a Japanese font
        run: |
          python -m pip install --quiet matplotlib
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          # matplotlib は入れたばかりのフォントを見つけられないことがある
          rm -rf ~/.cache/matplotlib

      - name: Count the day
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python scripts/day_report.py ${{ github.event.inputs.day }}
            exit 0
          fi
          # 前日 → 今日 の順。前日ぶんは、日付をまたいで走ったときの取りこぼし対策。
          # まだ記録が届く範囲にあれば数え直せるし、届かなければ小さい数になって
          # day_report.py 側が書き替えを断る（既にある数字は守られる）
          python scripts/day_report.py "$(TZ=Asia/Tokyo date -d yesterday +%F)" || true
          python scripts/day_report.py "$(TZ=Asia/Tokyo date +%F)"

      - name: Keep it if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/毎日の数字.csv docs/毎日の数字.png; then
            echo "変わりなし（書き替えを見送ったか、同じ数字）"
            exit 0
          fi
          git add docs/毎日の数字.csv docs/毎日の数字.png
          git commit -m "chore: record the numbers for $(TZ=Asia/Tokyo date +%F)"
          # ほかの作業が先に入っていることがあるので、載せ直してから送る
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "ぶつかったので $i 回目のやり直し"
            sleep 10
          done
          echo "::error::3回試しても送れませんでした。手で scripts/day_report.py を実行してください"
          exit 1
