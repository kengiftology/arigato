name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'pwa/**'
      - 'requirements.txt'
  workflow_dispatch:

# 入れ替えは1本ずつ。2本が同時に走ると、あとに終わった方が本番になり、
# どちらが動いているか分からなくなる（9/23、2つのトークの入れ替えが重なった）。
# 走っている分は止めず、順番待ちにする。
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 押す前に試験を通す（2026-09-25）。落ちたら本番には入らない。
  # 入れ替えは13〜15分かかるので、間違いはここで止めたほうが速い。
  # 9/25、区画の設定をコードから外に出したとき「動きが変わっていないこと」を手で確かめた。
  # 同じ確認を毎回手でやるのは続かないので、機械にやらせる。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install what the tests need
        # 2026-09-25：試験は server.routers.spirit を読み込む＝アプリの持ち物が全部要る。
        # 選んで並べていたら fastapi が抜けていて、入れ替えが止まった（手元では17件とも通る）。
        # 並べ直すのをやめ、本番と同じものを入れる。
        run: python -m pip install --quiet -r requirements.txt pytest
      - name: Run the tests
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Setup GCP Resources (idempotent)
        run: |
          PROJECT=${{ secrets.GCP_PROJECT_ID }}

          # API有効化
          gcloud services enable \
            run.googleapis.com \
            firestore.googleapis.com \
            storage.googleapis.com \
            cloudbuild.googleapis.com \
            --project $PROJECT

          # Firestore作成（既存の場合はスキップ）
          gcloud firestore databases create \
            --location=asia-northeast1 \
            --project $PROJECT 2>/dev/null || true

          # Cloud Storageバケット作成（既存の場合はスキップ）
          gsutil mb -l asia-northeast1 gs://arigato-photos 2>/dev/null || true
          gsutil iam ch allUsers:objectViewer gs://arigato-photos 2>/dev/null || true

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy arigato \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 1 \
            --memory 1Gi \
            --max-instances 1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars "GCS_BUCKET=arigato-photos,VAPID_EMAIL=${{ secrets.VAPID_EMAIL }},VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }},VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},TIMELAPSE_KEY=${{ secrets.TIMELAPSE_KEY }},TIMELAPSE_KEY_PREV=${{ secrets.TIMELAPSE_KEY_PREV }},NOTE_KEY=${{ secrets.NOTE_KEY }},GIT_SHA=${{ github.sha }},DEPLOYED_AT=${{ github.event.head_commit.timestamp }},NOTION_TOKEN=${{ secrets.NOTION_TOKEN }},NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }},SPIRIT_NOTION_TOKEN=${{ secrets.SPIRIT_NOTION_TOKEN }},SPIRIT_NOTION_DB=${{ secrets.SPIRIT_NOTION_DB }},FACE_ENABLED=1"

      # 入れ替えたあと、主な口が生きているか確かめる（2026-09-17）。
      # 9/13夜は入れ替え直後に /spirit の口が全部404になり、12時間だれも気づけなかった。
      # 失敗すればこの実行が赤くなり、GitHub から本人にメールが届く。
      - name: Check the main endpoints answer after deploy
        run: |
          BASE=https://arigato-3ipecjbnha-an.a.run.app
          sleep 20
          fail=0
          # /spirit/m は叩かない。C3 の生存の印は /presence?state= で数えるので直接は響かないが、
          # 確認のために本番の状態を動かす口を叩くのは避ける（2026-09-19）
          for path in /spirit/health /spirit/full /spirit/panel /spirit/presence /spirit/log; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BASE$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # 写真の受け口は、合言葉なしなら 401 が正しい（404 や 5xx なら壊れている）
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '' "$BASE/spirit/frame")
          echo "POST /spirit/frame (no key) -> $code"
          [ "$code" = "401" ] || fail=1
          exit $fail

      - name: Show container logs on failure
        if: failure()
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="arigato"' \
            --limit=60 --freshness=15m --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(textPayload)" | head -80
